<form formulario="ngForm">
    Introduce un numero:
    <select name="cajanumero" #cajanumero>
        @for (num of arraynumeros; track num){
            <option>{{num}}</option>
        }
    </select>
    <button (click)="numeroDoble()">Doblar el numero</button>
    <button (click)="generarNumero()">Numero Random</button>
</form>
<h2>El doble de este numero es {{doble}}</h2>
